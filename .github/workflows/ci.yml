name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      DEVENV_PROFILE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install just
        run: cargo install just --locked

      - name: Check formatting
        run: just fmt-check

      - name: Run tests
        run: just test

      - name: Run lint
        run: just lint
