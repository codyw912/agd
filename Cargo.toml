[package]
name = "agd"
version = "0.1.0"
edition = "2021"
description = "Agent Git Delegation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codyw912/agd"
readme = "README.md"

[dependencies]
anyhow = "1.0"
camino = { version = "1.1", features = ["serde1"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
toml = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
